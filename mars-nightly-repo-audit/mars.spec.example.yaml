# Example MARS / Managed Agents spec. Nix fills FRAMEWORK_REPO* when the
# public GitHub repo exists. Do not commit real API keys.

name: nightly-repo-audit
agent: langgraph
template: langgraph
size: mv-2vcpu-4gb
persistent_workspace: true

env:
  FRAMEWORK_REPO: "https://github.com/<owner>/mars-nightly-repo-audit.git"
  FRAMEWORK_REPO_SHA: "<exact-commit-sha>"
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: deepseek-v4-pro

secrets:
  HARNESS_INFERENCE_API_KEY: "<your-do-api-key>"

# Action Gateway — platform injects HARNESS_MCP_SERVERS (base64 JSON array) with
# do_actions VPC URL, e.g. [{"name":"do_actions","url":"http://trusted-actions.../mcp/session/<id>"}]
# Graph binds MCP client at runtime (not auto-wired by LangGraph Agent Server).
tools:
  # Narrow toolbelt: GitHub draft PR open only. Nix catalog may refine the id below.
  - do.actions:
      - do.actions.github.create_pull_request

permissions:
  default: ask
  # default: ask blocks in-band gateway MCP calls; allow required MCP tools explicitly.
  allow:
    - do.actions.github.create_pull_request
