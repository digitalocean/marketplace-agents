# Example MARS / Managed Agents spec. Do not commit real API keys.
# Inference model is Grok 4.7. Fixes are deterministic; the model writes
# the PR review note when SECURITY_SCAN_LLM_REVIEW=1 and a key is set.

name: nightly-repo-security-scan
agent: langgraph
template: langgraph
size: mv-2vcpu-4gb

env:
  FRAMEWORK_REPO: "https://github.com/digitalocean/marketplace-agents.git"
  FRAMEWORK_REPO_SHA: "<exact-commit-sha>"
  FRAMEWORK_SUBDIR: "mars-nightly-repo-security-scan"
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: grok-4.7
  SECURITY_SCAN_LLM_REVIEW: "1"

secrets:
  HARNESS_INFERENCE_API_KEY: "<your-do-api-key>"

# Action Gateway — platform injects HARNESS_MCP_SERVERS (base64 JSON) with
# do_actions VPC URL. Graph binds MCP client and calls action_invoke →
# github_create_pull_request (draft: true) after HITL approve.
tools:
  - do.actions

permissions:
  default: ask
  rules:
    # Graph HITL is the human gate. Gateway MCP has no in-band ask — allow MCP after approve.
    - tool: mcp
      action: allow
