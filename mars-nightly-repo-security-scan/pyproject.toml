[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightly-repo-security-scan"
version = "0.1.0"
description = "Nightly Repo Security Scan — LangGraph agent that fixes findings and drafts a PR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "langchain-openai>=0.2",
  "langgraph-checkpoint>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
